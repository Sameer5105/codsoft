<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

</head>
<body>
    <div class="container">
        <div class="wav">
            <img src="backg.png">
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Flavours</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">FAQ</a></li>
                <li><a href="#">About us</a></li>
            </ul>
          <div class="logo-container">
            <img src="image.jpg" class="logo">
            <span class="brand">BobaTea</span>
          </div>
        </nav>
        <div class="maincontent">
            <div class="imgcontent">
                <img id="slideshow" src="img10.jpg">
            </div>
            <div class="textcontent">
                <h1 class="h1">
                    The BobaTea
                </h1>
                <p class="p1">
                    Naturally brewed, joyfully chewy.
                </p>
                <p class="p2">
                    Experience the perfect blend of tea, 
                    milk, and chewy tapioca pearls in every cup.
                </p>
                <button class="custom-btn">
                    <div class="btn-text-wrapper">
                        <p class="btn-text-top">Explore Flavours</p>
                        <p class="btn-text-bottom">Explore Flavours</p>
                    </div>
                </button>

                
            </div>
        </div>
        <div class="right-section">
            <h2 class="fact">Sip happiness in every bubble!</h2>
            <p class="box">
                <span class="icon">🧋</span>
                Did you know? Tapioca pearls are made from cassava root!
            </p>
            <button class="order-btn">
                    <div class="order-wrap">
                        <p class="btn-top">Order now</p>
                        <p class="btn-bottom">Order now</p>
                    </div>
                </button>
        </div>
        <div class="socials">
            <i class="fab fa-instagram"></i>
            <i class="fab fa-facebook-f"></i>
            <i class="fas fa-envelope"></i>
            <i class="fab fa-twitter"></i>

        </div>
    

    </div>


    <script>const images = [
        'img10.jpg',
        'img11.jpg',
        'img12.jpg',
        'img14.jpg',
        
    ];

    let current = 0;
    const slideshow = document.getElementById('slideshow');

    setInterval(() => {
        current = (current + 1) % images.length;
        slideshow.src = images[current];
    }, 3000);
</script>

 
</body>
</html>
